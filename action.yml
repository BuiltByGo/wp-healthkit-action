name: 'WP HealthKit Audit'
# NOTE: Keep the layer count in sync with TOTAL_VERIFICATION_LAYERS in
# src/lib/marketing/scanner-counts.ts (currently 62 = 58 deterministic + 4 AI).
description: 'AI-powered security & quality audit for WordPress plugins — 62 verification layers including Wordfence CVEs, PHPCS, PHPStan, Semgrep, Psalm, and 4 AI engines'
branding:
  icon: 'shield'
  color: 'green'
inputs:
  api-key:
    description: 'WP HealthKit API key (Platform or Enterprise plan)'
    required: true
  plugin-path:
    description: 'Path to plugin directory (default: current directory)'
    required: false
    default: '.'
  fail-on:
    description: 'Fail the check if findings at this severity or above exist (CRITICAL, HIGH, MEDIUM, LOW, none)'
    required: false
    default: 'HIGH'
  api-url:
    description: 'WP HealthKit API URL'
    required: false
    default: 'https://wphealthkit.com'
  sarif:
    description: 'Write wphk-audit.sarif for GitHub code scanning (upload with github/codeql-action/upload-sarif)'
    required: false
    default: 'true'
outputs:
  report-url:
    description: 'URL to the full audit report'
  overall-risk:
    description: 'Overall risk level (CRITICAL, HIGH, MEDIUM, LOW)'
  findings-count:
    description: 'Total number of findings'
  critical-count:
    description: 'Number of critical findings'
  high-count:
    description: 'Number of high findings'
runs:
  using: 'composite'
  steps:
    - name: Preflight — verify required CLI tools are present
      shell: bash
      run: |
        # ubuntu-latest ships curl, jq, and zip by default. Non-Ubuntu runners
        # (Alpine, Windows, custom self-hosted images) may not — fail with a
        # clear error rather than a confusing "command not found" deeper in.
        missing=()
        for tool in curl jq zip; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            missing+=("$tool")
          fi
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::WP HealthKit Action requires the following tools to be on PATH but they are missing: ${missing[*]}. Install them on your runner image or switch to ubuntu-latest."
          exit 1
        fi
    - name: Package plugin
      shell: bash
      env:
        PLUGIN_PATH: ${{ inputs.plugin-path }}
      run: |
        cd "$PLUGIN_PATH"
        PLUGIN_DIR=$(basename "$(pwd)")
        cd ..
        ZIP_NAME="plugin-audit-${{ github.run_id }}-${{ github.run_attempt }}.zip"
        # Exclude VCS/build dirs AND anything that commonly holds secrets —
        # the zip is uploaded to the audit API.
        zip -r "/tmp/$ZIP_NAME" "$PLUGIN_DIR" \
          -x "*.git*" "*/node_modules/*" "*/vendor/*" "*/.svn/*" \
          -x "*/.env" "*/.env.*" "*/.env-*" \
          -x "*.pem" "*.key" "*.p12" "*.pfx" \
          -x "*/.htpasswd" "*/.htaccess" \
          -x "*wp-config.php" "*wp-config-sample.php"
        echo "ZIP_PATH=/tmp/$ZIP_NAME" >> $GITHUB_ENV
    - name: Run audit
      shell: bash
      id: audit
      env:
        WPHK_API_KEY: ${{ inputs.api-key }}
      run: |
        # Capture both response body and HTTP status so we can surface
        # auth (401) and quota (429) errors with actionable messages.
        # The API key is passed via env (not interpolated into the command
        # text) so it never appears in the rendered/logged run script.
        HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ inputs.api-url }}/api/agency/audits" \
          -H "Authorization: Bearer $WPHK_API_KEY" \
          -F "plugin=@$ZIP_PATH")
        HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1 | sed 's/HTTP_STATUS://')
        RESPONSE=$(echo "$HTTP_RESPONSE" | sed '$d')

        if [ "$HTTP_STATUS" = "401" ]; then
          echo "::error::WP HealthKit API returned 401 Unauthorized. Check that WP_HEALTHKIT_API_KEY is set as a repository secret and that the key has not been revoked. Generate a new one at ${{ inputs.api-url }}/settings/api-keys."
          exit 1
        fi
        if [ "$HTTP_STATUS" = "403" ]; then
          echo "::error::WP HealthKit API returned 403 Forbidden. GitHub Action audits require a Platform or Enterprise plan. Upgrade at ${{ inputs.api-url }}/pricing."
          exit 1
        fi
        if [ "$HTTP_STATUS" = "429" ]; then
          echo "::error::WP HealthKit API returned 429 Too Many Requests. You have exceeded your monthly audit quota. Either upgrade your plan or add 'paths:' filters to your workflow so audits only fire on PHP/dependency changes — see https://wphealthkit.com/docs/github#troubleshooting."
          exit 1
        fi
        if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
          echo "::error::WP HealthKit API returned HTTP $HTTP_STATUS. Response: $RESPONSE"
          exit 1
        fi

        REPORT_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
        RISK=$(echo "$RESPONSE" | jq -r '.overallRisk // "UNKNOWN"')
        FINDINGS=$(echo "$RESPONSE" | jq -r '.findingsCount // 0')
        CRITICAL=$(echo "$RESPONSE" | jq -r '.criticalCount // 0')
        HIGH=$(echo "$RESPONSE" | jq -r '.highCount // 0')

        echo "report-url=${{ inputs.api-url }}/results/$REPORT_ID" >> $GITHUB_OUTPUT
        echo "overall-risk=$RISK" >> $GITHUB_OUTPUT
        echo "findings-count=$FINDINGS" >> $GITHUB_OUTPUT
        echo "critical-count=$CRITICAL" >> $GITHUB_OUTPUT
        echo "high-count=$HIGH" >> $GITHUB_OUTPUT

        # Determine pass/fail
        FAIL_ON="${{ inputs.fail-on }}"
        FAILED=false

        if [ "$FAIL_ON" = "CRITICAL" ] && [ "$CRITICAL" -gt 0 ]; then FAILED=true; fi
        if [ "$FAIL_ON" = "HIGH" ] && ([ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]); then FAILED=true; fi
        if [ "$FAIL_ON" = "MEDIUM" ] && ([ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$(echo "$RESPONSE" | jq -r '.mediumCount // 0')" -gt 0 ]); then FAILED=true; fi
        if [ "$FAIL_ON" = "LOW" ] && ([ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$(echo "$RESPONSE" | jq -r '.mediumCount // 0')" -gt 0 ] || [ "$(echo "$RESPONSE" | jq -r '.lowCount // 0')" -gt 0 ]); then FAILED=true; fi

        # Output summary
        echo "## WP HealthKit Audit Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Overall Risk:** $RISK" >> $GITHUB_STEP_SUMMARY
        echo "**Findings:** $FINDINGS total ($CRITICAL critical, $HIGH high)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "[View Full Report](${{ inputs.api-url }}/results/$REPORT_ID)" >> $GITHUB_STEP_SUMMARY

        if [ "$FAILED" = "true" ]; then
          echo "::error::Audit failed: $RISK risk with $FINDINGS findings (threshold: $FAIL_ON)"
        fi

        echo "REPORT_ID=$REPORT_ID" >> $GITHUB_ENV
        echo "AUDIT_FAILED=$FAILED" >> $GITHUB_ENV

    - name: Write SARIF for code scanning
      if: inputs.sarif == 'true'
      shell: bash
      env:
        WPHK_API_KEY: ${{ inputs.api-key }}
      run: |
        SARIF_STATUS=$(curl -s -o wphk-audit.sarif -w "%{http_code}" \
          "${{ inputs.api-url }}/api/v1/reports/$REPORT_ID/sarif" \
          -H "Authorization: Bearer $WPHK_API_KEY")
        if [ "$SARIF_STATUS" = "200" ]; then
          echo "Wrote wphk-audit.sarif — upload it with github/codeql-action/upload-sarif:"
          echo ""
          echo "  - uses: github/codeql-action/upload-sarif@v3"
          echo "    with:"
          echo "      sarif_file: wphk-audit.sarif"
          echo "      category: wp-healthkit"
        else
          echo "::warning::SARIF download returned HTTP $SARIF_STATUS — skipping code-scanning artifact"
          rm -f wphk-audit.sarif
        fi

    - name: Fail on threshold
      if: env.AUDIT_FAILED == 'true'
      shell: bash
      run: exit 1

    - name: Clean up packaged zip
      if: always()
      shell: bash
      run: rm -f "$ZIP_PATH"
